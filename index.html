<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FONEX — Form Your Identity</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#f2f2f2;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

/* INTRO */

.intro{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    animation:introOut 1.2s ease forwards;
    animation-delay:1.8s;
}

.intro-logo{
    font-size:clamp(70px,15vw,220px);
    font-weight:900;
    letter-spacing:-10px;
    animation:introText 1.5s ease;
}

@keyframes introText{
    from{
        opacity:0;
        transform:scale(.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes introOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    padding:0 4vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:1000;
    mix-blend-mode:difference;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.3s;
}

nav a:hover{
    opacity:.45;
}

.bag-link span{
    opacity:.55;
    margin-left:4px;
}

/* HERO */

.hero{
    height:100vh;
    min-height:700px;
    position:relative;
    display:flex;
    align-items:flex-end;
    padding:0 4vw 7vh;
    overflow:hidden;
}

.hero-image{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.7)
        ),
        url("https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=2000&q=90");
    background-size:cover;
    background-position:center;
    transform:scale(1.05);
}

.hero-content{
    position:relative;
    z-index:2;
    width:100%;
}

.hero-small{
    font-size:9px;
    letter-spacing:4px;
    margin-bottom:25px;
    opacity:.7;
}

.hero-title{
    font-size:clamp(55px,11vw,170px);
    line-height:.82;
    font-weight:900;
    letter-spacing:-7px;
    max-width:1300px;
}

.hero-description{
    margin-top:40px;
    max-width:390px;
    font-size:12px;
    line-height:1.7;
    color:#aaa;
}

.hero-button{
    display:inline-block;
    margin-top:35px;
    border-bottom:1px solid #fff;
    padding-bottom:8px;
    font-size:9px;
    letter-spacing:3px;
}

/* MARQUEE */

.marquee{
    overflow:hidden;
    white-space:nowrap;
    border-top:1px solid #222;
    border-bottom:1px solid #222;
}

.marquee-track{
    display:inline-block;
    padding:22px 0;
    animation:marquee 25s linear infinite;
}

.marquee span{
    font-size:11px;
    letter-spacing:5px;
    margin:0 35px;
}

@keyframes marquee{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* GENERAL */

section{
    padding:140px 4vw;
}

.section-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:80px;
}

.section-number{
    font-size:9px;
    color:#666;
    letter-spacing:3px;
}

.section-title{
    font-size:clamp(35px,5vw,80px);
    font-weight:800;
    letter-spacing:-4px;
}

/* COLLECTION */

.collection{
    background:#050505;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:2px;
}

.product{
    position:relative;
    cursor:pointer;
    overflow:hidden;
    background:#111;
}

.product-image{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    display:block;
    transition:transform .8s cubic-bezier(.2,.7,.2,1);
}

.product:hover .product-image{
    transform:scale(1.035);
}

.product-info{
    position:absolute;
    left:25px;
    right:25px;
    bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    z-index:2;
}

.product-name{
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.product-code{
    font-size:8px;
    color:#aaa;
    margin-top:7px;
    letter-spacing:2px;
}

.product-view{
    font-size:8px;
    letter-spacing:2px;
    border-bottom:1px solid #fff;
    padding-bottom:4px;
}

.product::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 55%,
        rgba(0,0,0,.8)
    );
    pointer-events:none;
}

/* PRODUCT 001 */

.product:nth-child(1) .product-image{
    background:#ddd;
}

/* PRODUCT 002 */

.product:nth-child(2) .product-image{
    background:#222;
}

/* PRODUCT 003 */

.product:nth-child(3) .product-image{
    background:#eee;
}

/* PRODUCT 004 */

.product:nth-child(4) .product-image{
    background:#181818;
}

/* PRODUCT 005 */

.product:nth-child(5) .product-image{
    background:#ddd;
}

/* PRODUCT 006 */

.product:nth-child(6) .product-image{
    background:#191919;
}

/* PRODUCT 007 */

.product:nth-child(7) .product-image{
    background:#222;
}

/* PRODUCT 008 */

.product:nth-child(8) .product-image{
    background:#ddd;
}

/* BIG TYPE */

.big-type{
    min-height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}

.big-type-line{
    font-size:clamp(70px,15vw,230px);
    font-weight:900;
    line-height:.8;
    letter-spacing:-12px;
    white-space:nowrap;
}

.big-type-line:nth-child(2){
    margin-left:12vw;
}

/* EDITORIAL */

.editorial{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
}

.editorial-image{
    width:65%;
    margin-left:auto;
    aspect-ratio:4/5;
    overflow:hidden;
}

.editorial-image img{
    width:100%;
    height:120%;
    object-fit:cover;
    transform:translateY(-10%);
}

.editorial-text{
    position:absolute;
    left:4vw;
    bottom:12%;
    max-width:450px;
}

.editorial-label{
    font-size:9px;
    letter-spacing:3px;
    color:#888;
    margin-bottom:25px;
}

.editorial-title{
    font-size:clamp(45px,7vw,100px);
    font-weight:900;
    line-height:.85;
    letter-spacing:-6px;
}

.editorial-description{
    font-size:11px;
    line-height:1.8;
    color:#999;
    margin-top:30px;
    max-width:300px;
}

/* PHILOSOPHY */

.philosophy{
    min-height:100vh;
    display:flex;
    align-items:center;
}

.philosophy-inner{
    width:100%;
}

.philosophy-word{
    font-size:clamp(60px,13vw,200px);
    font-weight:900;
    letter-spacing:-10px;
    line-height:.8;
}

.philosophy-word:nth-child(2){
    text-align:right;
}

.philosophy-word:nth-child(3){
    margin-left:12vw;
}

.philosophy-copy{
    max-width:360px;
    margin:70px auto 0;
    text-align:center;
    color:#888;
    font-size:11px;
    line-height:1.8;
}

/* LOOKBOOK */

.lookbook{
    background:#0b0b0b;
}

.lookbook-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
}

.look{
    overflow:hidden;
    position:relative;
}

.look img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    display:block;
    transition:transform 1s ease;
}

.look:hover img{
    transform:scale(1.04);
}

.look-number{
    position:absolute;
    top:20px;
    left:20px;
    font-size:9px;
    letter-spacing:2px;
}

/* ARCHIVE */

.archive{
    border-top:1px solid #222;
}

.archive-list{
    border-top:1px solid #222;
}

.archive-item{
    display:grid;
    grid-template-columns:100px 1fr auto;
    gap:30px;
    padding:30px 0;
    border-bottom:1px solid #222;
    align-items:center;
}

.archive-number{
    color:#666;
    font-size:9px;
    letter-spacing:2px;
}

.archive-title{
    font-size:clamp(25px,4vw,55px);
    font-weight:700;
    letter-spacing:-2px;
}

.archive-arrow{
    font-size:18px;
}

/* ABOUT */

.about{
    min-height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.about-title{
    font-size:clamp(60px,12vw,190px);
    font-weight:900;
    line-height:.78;
    letter-spacing:-10px;
}

.about-title span{
    display:block;
}

.about-title span:nth-child(2){
    margin-left:13vw;
}

.about-title span:nth-child(3){
    margin-left:25vw;
}

.about-copy{
    max-width:450px;
    margin:80px 0 0 auto;
    font-size:12px;
    line-height:1.9;
    color:#999;
}

/* ADORNARE */

.adornare{
    padding:100px 4vw;
    border-top:1px solid #222;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.adornare-label{
    font-size:9px;
    letter-spacing:3px;
    color:#666;
}

.adornare-title{
    font-size:clamp(40px,7vw,100px);
    font-weight:900;
    letter-spacing:-5px;
}

.adornare-link{
    font-size:9px;
    letter-spacing:3px;
    border-bottom:1px solid #fff;
    padding-bottom:8px;
}

/* FOOTER */

footer{
    padding:80px 4vw 35px;
}

.footer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.footer-logo{
    font-size:clamp(60px,12vw,180px);
    font-weight:900;
    letter-spacing:-10px;
    line-height:.7;
}

.footer-links{
    display:flex;
    gap:30px;
}

.footer-links a{
    font-size:8px;
    letter-spacing:2px;
}

.footer-bottom{
    margin-top:120px;
    padding-top:20px;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#555;
    letter-spacing:2px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(15px);
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    opacity:0;
    visibility:hidden;
    transition:.4s;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-box{
    width:min(1100px,100%);
    max-height:90vh;
    background:#101010;
    display:grid;
    grid-template-columns:1fr 1fr;
    overflow:auto;
    transform:translateY(30px);
    transition:.5s;
}

.modal.active .modal-box{
    transform:translateY(0);
}

.modal-image{
    width:100%;
    height:100%;
    min-height:600px;
    object-fit:cover;
}

.modal-content{
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.close{
    align-self:flex-end;
    border:0;
    background:none;
    color:#fff;
    font-size:9px;
    letter-spacing:2px;
    cursor:pointer;
}

.modal-code{
    color:#777;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:18px;
}

.modal-title{
    font-size:clamp(35px,5vw,70px);
    line-height:.9;
    letter-spacing:-4px;
}

.modal-description{
    color:#888;
    font-size:11px;
    line-height:1.8;
    max-width:380px;
    margin-top:30px;
}

/* PRODUCT DETAIL ENHANCEMENTS */

.modal-price{
    margin-top:24px;
    font-size:22px;
    letter-spacing:-1px;
}

.modal-meta{
    margin-top:28px;
    display:grid;
    gap:18px;
}

.modal-label{
    display:block;
    margin-bottom:10px;
    font-size:9px;
    color:#777;
    letter-spacing:2px;
    text-transform:uppercase;
}

.size-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
}

.size-btn{
    border:1px solid #333;
    background:transparent;
    color:#fff;
    padding:13px 8px;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.25s;
}

.size-btn:hover,
.size-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.add-bag{
    width:100%;
    margin-top:26px;
    border:1px solid #fff;
    background:#fff;
    color:#000;
    padding:17px 20px;
    font-size:10px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.3s;
}

.add-bag:hover{
    background:transparent;
    color:#fff;
}

.add-bag.added{
    background:#222;
    color:#fff;
    border-color:#444;
}

.modal-status{
    margin-top:12px;
    min-height:14px;
    font-size:9px;
    color:#777;
    letter-spacing:1px;
}

                    "ADD TO BAG";

                addBag.classList.remove("added");

    const closeButton =
        document.getElementById("close");

    closeButton.addEventListener("click", () => {

        modal.classList.remove("active");

        document.body.style.overflow = "";

    });


    modal.addEventListener("click", e => {

        if(e.target === modal){

            modal.classList.remove("active");

            document.body.style.overflow = "";

        }

    });


    document.addEventListener("keydown", e => {

        if(e.key === "Escape"){

            modal.classList.remove("active");

            document.body.style.overflow = "";

        }

    });


    /* BAG COUNT */

    function updateBagCount(){

        const cart =
            JSON.parse(
                localStorage.getItem("fonexCart") || "[]"
            );

        const count =
            document.getElementById("bagCount");

        if(count){

            count.textContent =
                cart.length;

        }

    }

    updateBagCount();


    /* LOOKBOOK PARALLAX */

    const looks =
        document.querySelectorAll(".look img");

    window.addEventListener("scroll", () => {

        if(window.innerWidth <= 700) return;

        looks.forEach(img => {

            const rect =
                img.getBoundingClientRect();

            const movement =
                (window.innerHeight / 2 - rect.top) * .025;

            img.style.transform =
                `scale(1.05) translateY(${movement}px)`;

        });

    });


    /* SMOOTH NAVIGATION */

    document.querySelectorAll('a[href^="#"]').forEach(link => {

        link.addEventListener("click", e => {

            const target =
                document.querySelector(
                    link.getAttribute("href")
                );

            if(target){

                e.preventDefault();

                target.scrollIntoView({
                    behavior:"smooth"
                });

            }

        });

    });


</script>

</body>

</html>
